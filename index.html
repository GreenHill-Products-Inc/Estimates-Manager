<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenHill Products Inc. — Manage Estimates</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  :root{
    --green:#76BC21; --deep-green:#5A9A18; --light:#A8D85A; --sidebar:#1A2318;
    --mint:#EAFAD2; --charcoal:#3D4F38; --dark:#1E2A1A; --mid:#7A8C75;
    --border:#DDE8D8; --bg:#F0F4EE; --amber:#D68910; --amber-bg:#FEF9E7;
    --red:#C0392B; --red-bg:#FDECEA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--dark); display:flex; min-height:100vh; background:#fff;
  }
  /* Glass, done right on a plain white page: blur only matters where something sits
     behind it (the modal overlay). Everything else is a clean, opaque card with a
     soft shadow and hairline border -- crisp edges, sharp text. */
  .glass{
    background:#fff; border:1px solid var(--border);
    box-shadow:0 4px 16px rgba(20,30,15,.06);
  }
  .sidebar{
    width:230px; flex-shrink:0; color:#fff; background:var(--sidebar);
    display:flex; flex-direction:column; padding:22px 16px; position:sticky; top:0; height:100vh;
  }
  .logo-chip{ background:rgba(255,255,255,.9); border-radius:10px; padding:10px 12px; display:block; margin-bottom:16px; width:fit-content; }
  .logo-chip img{ height:26px; width:auto; display:block; }
  .logo-sub{ font-size:11px; color:#9db08c; margin-bottom:24px; }
  .back-link{
    display:flex; align-items:center; gap:6px; color:#b8c4ac; text-decoration:none; font-size:12px;
    margin-bottom:22px; padding:8px 10px; border:1px solid rgba(255,255,255,.12); border-radius:10px;
    transition:color .15s ease, border-color .15s ease;
  }
  .back-link:hover{ color:#fff; border-color:rgba(255,255,255,.3); }
  .status-pill{ font-size:11px; color:#9db08c; padding:8px 10px; }

  .main{ flex:1; padding:32px 36px; overflow-x:auto; }
  .main h1{ font-size:22px; margin:0 0 4px; }
  .main .sub{ font-size:13px; color:var(--mid); margin:0 0 22px; }

  /* Scorecards */
  .scorecards{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:14px; margin-bottom:24px; }
  .card{
    background:#fff; border:1px solid var(--border); border-radius:18px; padding:18px 20px;
    box-shadow:0 2px 10px rgba(20,30,15,.05);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{ transform:translateY(-2px); box-shadow:0 12px 28px rgba(20,30,15,.12); }
  .card .label{ font-size:11px; text-transform:uppercase; letter-spacing:.3px; color:var(--mid); margin-bottom:6px; }
  .card .value{ font-size:22px; font-weight:700; color:var(--dark); }
  .card.approved .value{ color:var(--deep-green); }
  .card.lost .value{ color:var(--red); }
  .card.pending .value{ color:var(--amber); }

  .toolbar{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; align-items:center; }
  .toolbar input, .toolbar select{
    border:1px solid var(--border); border-radius:12px; padding:9px 12px; font-size:13px; font-family:inherit;
    background:#fff; color:var(--dark); transition:border-color .15s ease, box-shadow .15s ease;
  }
  .toolbar input:focus, .toolbar select:focus{ outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(118,188,33,.15); }
  .toolbar input[type=text]{ flex:1; min-width:220px; }
  .btn{
    border:none; border-radius:20px; padding:9px 18px; font-size:13px; font-weight:600; cursor:pointer;
    background:linear-gradient(180deg, rgba(140,205,50,.95), rgba(90,154,24,.95)); color:#fff;
    box-shadow:0 4px 14px rgba(90,154,24,.35), inset 0 1px 0 rgba(255,255,255,.35);
    transition:background .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .btn:hover{ box-shadow:0 6px 18px rgba(90,154,24,.45), inset 0 1px 0 rgba(255,255,255,.4); }
  .btn:active{ transform:scale(.97); }
  .btn.ghost{
    background:#fff; border:1px solid var(--border); color:var(--charcoal); box-shadow:none;
  }
  .btn.ghost:hover{ background:var(--bg); }

  .view-toggle{
    display:flex; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:#fff;
  }
  .view-toggle button{
    border:none; background:transparent; color:var(--charcoal); padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer;
    transition:background .15s ease;
  }
  .view-toggle button.active{ background:linear-gradient(180deg, rgba(140,205,50,.95), rgba(90,154,24,.95)); color:#fff; }

  /* Kanban board */
  .board{ display:grid; grid-template-columns:repeat(3, minmax(260px, 1fr)); gap:16px; align-items:start; }
  .board-col{
    background:var(--bg); border:1px solid var(--border); border-radius:16px; padding:12px; min-height:120px;
  }
  .board-col.drag-over{ outline:2px dashed var(--light); outline-offset:-2px; }
  .board-col-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding:0 4px; }
  .board-col-head h3{ font-size:12.5px; text-transform:uppercase; letter-spacing:.3px; margin:0; }
  .board-col-head .count{ font-size:11px; background:#fff; border:1px solid var(--border); border-radius:20px; padding:2px 9px; font-weight:700; }
  .board-col.pending .board-col-head h3{ color:var(--amber); }
  .board-col.approved .board-col-head h3{ color:var(--deep-green); }
  .board-col.lost .board-col-head h3{ color:var(--red); }
  .board-col-total{ font-size:11px; color:var(--mid); margin:-6px 4px 10px; }

  .board-card{
    background:#fff; border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:10px;
    cursor:grab; box-shadow:0 1px 3px rgba(20,30,15,.06);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .board-card:hover{ transform:translateY(-2px); box-shadow:0 10px 22px rgba(20,30,15,.12); }
  .board-card:active{ cursor:grabbing; }
  .board-card.dragging{ opacity:.4; }
  .board-card .bc-top{ display:flex; justify-content:space-between; align-items:start; gap:8px; margin-bottom:6px; }
  .board-card .bc-est{ font-size:12.5px; font-weight:700; }
  .board-card .bc-value{ font-size:12px; font-weight:700; color:var(--deep-green); }
  .board-card .bc-client{ font-size:12.5px; font-weight:600; margin-bottom:2px; }
  .board-card .bc-rep{ font-size:11px; color:var(--mid); }
  .board-empty{ font-size:11.5px; color:var(--mid); text-align:center; padding:16px 6px; }

  table{
    width:100%; border-collapse:collapse; background:#fff;
    border:1px solid var(--border); border-radius:16px; overflow:hidden;
    box-shadow:0 2px 10px rgba(20,30,15,.05);
  }
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--mid);
    background:var(--bg); padding:10px 14px; border-bottom:1px solid var(--border); position:sticky; top:0;
  }
  tbody td{ padding:11px 14px; font-size:13px; border-bottom:1px solid rgba(221,232,216,.6); }
  tbody tr{ cursor:pointer; transition:background .12s ease; }
  tbody tr:hover{ background:rgba(168,216,90,.18); }
  tbody tr td:first-child{ border-left:3px solid transparent; }
  tbody tr.row-approved td:first-child{ border-left-color:var(--deep-green); }
  tbody tr.row-lost td:first-child{ border-left-color:var(--red); }
  tbody tr.row-pending td:first-child{ border-left-color:var(--amber); }

  .badge{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; display:inline-block; }
  .badge.approved{ background:var(--mint); color:var(--deep-green); }
  .badge.lost{ background:var(--red-bg); color:var(--red); }
  .badge.pending{ background:var(--amber-bg); color:var(--amber); }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--mid); font-size:13.5px; }

  /* Edit modal -- centered popup with blurred backdrop */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(20,28,18,.5); backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px); z-index:50; opacity:0; transition:opacity .22s ease;
  }
  .overlay.open{ display:block; opacity:1; }
  .panel{
    position:fixed; top:50%; left:50%; width:600px; max-width:92vw; max-height:86vh;
    background:#fff; border:1px solid var(--border);
    border-radius:24px; box-shadow:0 30px 70px rgba(10,15,8,.25); z-index:60;
    transform:translate(-50%,-48%) scale(.96); opacity:0; pointer-events:none;
    transition:transform .25s cubic-bezier(.16,.9,.3,1), opacity .18s ease;
    padding:32px 34px; overflow-y:auto;
  }
  .panel.open{ transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto; }
  .panel-close{
    position:absolute; top:18px; right:18px; width:32px; height:32px; border-radius:50%;
    border:1px solid var(--border); background:var(--bg); color:var(--charcoal); font-size:16px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:background .15s ease;
  }
  .panel-close:hover{ background:var(--border); }
  .panel h2{ font-size:19px; margin:0 0 4px; padding-right:36px; }
  .panel .est-sub{ font-size:12.5px; color:var(--mid); margin:0 0 20px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:11.5px; font-weight:600; color:var(--charcoal); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-size:13px; font-family:inherit;
    background:#fff; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(118,188,33,.15); }
  .field textarea{ min-height:80px; resize:vertical; }
  .readonly-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; margin-bottom:20px;
    background:var(--bg); border:1px solid var(--border); border-radius:16px; padding:16px 18px;
  }
  .readonly-grid div{ font-size:12px; }
  .readonly-grid .k{ color:var(--mid); margin-bottom:2px; }
  .readonly-grid .v{ font-weight:600; }

  /* Line items — visual, selectable */
  .line-items-head{ display:flex; align-items:center; justify-content:space-between; margin:22px 0 10px; }
  .line-items-head h3{ font-size:13px; margin:0; text-transform:uppercase; letter-spacing:.3px; color:var(--charcoal); }
  .line-items-head .hint{ font-size:11px; color:var(--mid); }
  .line-item{
    display:flex; align-items:center; gap:10px; border:1px solid var(--border); border-radius:12px;
    padding:9px 12px; margin-bottom:8px; background:var(--bg);
    transition:border-color .15s ease, background .15s ease;
  }
  .line-item.selected{ border-color:var(--light); background:var(--mint); }
  .line-item input[type=checkbox]{ width:16px; height:16px; accent-color:var(--green); flex-shrink:0; }
  .line-item .li-name{ flex:1; font-size:12.5px; font-weight:600; }
  .line-item input[type=number]{
    width:110px; border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:12.5px; font-family:inherit;
  }
  .line-item input[type=number]:disabled{ background:#f2f2f0; color:var(--mid); }

  .panel-actions{ display:flex; gap:10px; margin-top:16px; }
  .save-msg{ font-size:12px; margin-top:10px; display:none; }
  .save-msg.ok{ color:var(--deep-green); }
  .save-msg.err{ color:var(--red); }
</style>
</head>

<div class="panel" id="editPanel">
  <button class="panel-close" id="panelCloseBtn" aria-label="Close">✕</button>
  <h2 id="panelTitle">Estimate</h2>
  <p class="est-sub" id="panelSub">—</p>

  <div class="readonly-grid" id="readonlyGrid"></div>

  <div class="field">
    <label>Status</label>
    <select id="fStatus">
      <option value="">Pending (no status)</option>
      <option value="Approved">Approved</option>
      <option value="Lost">Lost</option>
    </select>
  </div>
  <div class="field">
    <label>Final Value (what the client actually paid)</label>
    <input type="number" step="0.01" id="fFinalValue" placeholder="0.00">
  </div>
  <div class="field">
    <label>Notes</label>
    <textarea id="fNotes" placeholder="Internal notes…"></textarea>
  </div>

  <div class="line-items-head">
    <h3>Line Items</h3>
    <span class="hint">Select each product to edit its value</span>
  </div>
  <div id="lineItemsWrap"></div>

  <div class="panel-actions">
    <button class="btn" id="saveBtn">Save changes</button>
    <button class="btn ghost" id="cancelBtn">Cancel</button>
  </div>
  <div class="save-msg" id="saveMsg"></div>
</div>

<script>
  /* ================= CONFIG ================= */
  // URL of the NEW, SEPARATE Apps Script project (apps-script-additions-ALL.gs) --
  // this is NOT the same URL as the Estimate Builder's own script.
  // Deploy that file as its own Web App and paste the resulting /exec URL here.
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0DOnHom9GUWEUUtJUP-FZ_eVjTfbT1klgCTxcBXNAAErNSLbE1wgF_c103KvCjbuUpw/exec";

  // Shared secret required by the Apps Script backend on every request (see
  // SHARED_SECRET in apps-script-additions-ALL.gs). Must match EXACTLY --
  // if you ever rotate the secret in the script, update it here too and
  // republish both, otherwise every request from this page starts failing
  // with "Unauthorized."
  const APPS_SCRIPT_KEY = "fVkO0CgIYkFrHHGLSyHQwdGMkfASJL3l3MFa_cY_MCE";

  // Sheet column headers (adjust if your real headers differ)
  // These now match the REAL headers on row 5 of "Estimates Log", confirmed
  // 2026-08-03 from Sebastian's actual header row.
  const COL = {
    ESTIMATE_NUMBER: 'Estimate #',
    DATE: 'Date',
    CLIENT: 'Client / Builder',
    REP: 'Sales Rep',
    STATUS: 'Status',
    QUOTED: 'Estimate Value',
    FINAL: 'Final Value',
    LOST: 'Value Lost',
    NOTES: 'Notes',
    WEEK: 'Week #',
    SUBDIVISION: 'Subdivision',
    LOT: 'Lot #',
    ADDRESS: 'Address',
    CITY: 'City',
    STATE_ZIP: 'State / ZIP',
    CUSTOMER_TYPE: 'Customer Type',
    WORK_ORDER: 'Work Order #',
    CLOSE_DATE: 'Close Date',
    DATE_REQUESTED: 'Date Requested'
  };

  // Any header NOT in this list is treated as a line item (product) column
  // and shown individually in the detail panel as a selectable, editable row.
  // Everything except the 13 "<Product> $" columns is meta, per the real header row.
  const META_COLUMNS = [
    'Date', 'Estimate #', 'Week #', 'Client / Builder', 'Subdivision', 'Lot #',
    'Address', 'City', 'State / ZIP', 'Sales Rep', 'Customer Type', 'Status',
    'Estimate Value', 'Final Value', 'Value Lost', 'Work Order #', 'Close Date',
    'Notes', 'Date Requested'
  ];

  // Hub URL -- used by the "Back to Hub" link
  const HUB_URL = "https://greenhill-products-inc.github.io/GreenHill-Hub/";

  let allRows = [];
  let allHeaders = [];
  let activeRow = null;
  let currentView = 'board'; // 'board' | 'table'
  let draggedRow = null;

  document.getElementById('backToHub').href = HUB_URL;

  function fmtMoney(v){
    const n = Number(v);
    if (isNaN(n) || v === '' || v === null) return '—';
    return n.toLocaleString('en-US', { style:'currency', currency:'USD' });
  }

  function statusKey(status){
    const s = String(status || '').trim().toLowerCase();
    if (s === 'approved') return 'approved';
    if (s === 'lost') return 'lost';
    return 'pending';
  }

  function statusBadge(status){
    const key = statusKey(status);
    const label = key === 'pending' ? 'Pending' : (key.charAt(0).toUpperCase() + key.slice(1));
    return '<span class="badge ' + key + '">' + label + '</span>';
  }

  async function loadEstimates(){
    document.getElementById('connStatus').textContent = 'Loading…';
    document.getElementById('tableWrap').innerHTML = '<div class="empty-state">Loading estimates…</div>';

    if (APPS_SCRIPT_URL.indexOf('PASTE_YOUR_NEW') === 0){
      document.getElementById('connStatus').textContent = 'Not connected';
      document.getElementById('tableWrap').innerHTML =
        '<div class="empty-state">APPS_SCRIPT_URL is not configured yet.<br>Deploy <code>apps-script-additions-ALL.gs</code> as its own Web App and paste the URL in the code.</div>';
      return;
    }

    try{
      const res = await fetch(APPS_SCRIPT_URL + '?action=list&key=' + encodeURIComponent(APPS_SCRIPT_KEY));
      const data = await res.json();
      if (!data.ok){ throw new Error(data.error || 'Unknown error'); }
      allRows = data.rows || [];
      allHeaders = data.headers || [];
      document.getElementById('connStatus').textContent = 'Connected · ' + allRows.length + ' estimates';
      renderScorecards();
      renderActiveView();
    }catch(err){
      document.getElementById('connStatus').textContent = 'Not connected';
      document.getElementById('tableWrap').innerHTML =
        '<div class="empty-state">Could not connect to the Sheet.<br>Check that you added the functions from <code>estimates-manager-apps-script.gs</code> and created a new deployment.<br><small>' +
        (err.message || '') + '</small></div>';
    }
  }

  function renderScorecards(){
    let approvedTotal = 0, lostTotal = 0, pendingCount = 0, approvedCount = 0, lostCount = 0;
    allRows.forEach(r => {
      const v = r.values;
      const key = statusKey(v[COL.STATUS]);
      if (key === 'approved'){ approvedTotal += Number(v[COL.FINAL]) || 0; approvedCount++; }
      else if (key === 'lost'){ lostTotal += Number(v[COL.LOST]) || 0; lostCount++; }
      else pendingCount++;
    });
    const decided = approvedCount + lostCount;
    const winRate = decided ? Math.round((approvedCount / decided) * 100) : 0;

    document.getElementById('scorecards').innerHTML = `
      <div class="card"><div class="label">Total Estimates</div><div class="value">${allRows.length}</div></div>
      <div class="card approved"><div class="label">Approved Value</div><div class="value">${fmtMoney(approvedTotal)}</div></div>
      <div class="card pending"><div class="label">Pending</div><div class="value">${pendingCount}</div></div>
      <div class="card lost"><div class="label">Lost Value</div><div class="value">${fmtMoney(lostTotal)}</div></div>
      <div class="card"><div class="label">Win Rate</div><div class="value">${winRate}%</div></div>
    `;
  }

  function filteredRows(){
    const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
    const statusFilter = document.getElementById('statusFilter').value;

    return allRows.filter(r => {
      const v = r.values;
      if (q){
        const haystack = JSON.stringify(v).toLowerCase();
        if (haystack.indexOf(q) === -1) return false;
      }
      if (statusFilter){
        if (statusKey(v[COL.STATUS]) !== statusKey(statusFilter)) return false;
      }
      return true;
    });
  }

  function renderTable(){
    const rows = filteredRows();
    const wrap = document.getElementById('tableWrap');
    if (!rows.length){
      wrap.innerHTML = '<div class="empty-state">No estimates match this filter.</div>';
      return;
    }
    let html = '<table><thead><tr>' +
      '<th>Estimate</th><th>Date</th><th>Client</th><th>Rep</th><th>Status</th>' +
      '<th>Quoted</th><th>Final</th><th>Value Lost</th>' +
      '</tr></thead><tbody>';
    rows.forEach(r => {
      const v = r.values;
      html += `<tr class="row-${statusKey(v[COL.STATUS])}" data-row="${r.row}">
        <td>${v[COL.ESTIMATE_NUMBER] || '—'}</td>
        <td>${v[COL.DATE] || '—'}</td>
        <td>${v[COL.CLIENT] || '—'}</td>
        <td>${v[COL.REP] || '—'}</td>
        <td>${statusBadge(v[COL.STATUS])}</td>
        <td>${fmtMoney(v[COL.QUOTED])}</td>
        <td>${fmtMoney(v[COL.FINAL])}</td>
        <td>${fmtMoney(v[COL.LOST])}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;

    wrap.querySelectorAll('tbody tr').forEach(tr => {
      tr.addEventListener('click', () => openPanel(Number(tr.getAttribute('data-row'))));
    });
  }

  function renderActiveView(){
    if (currentView === 'board'){
      document.getElementById('boardWrap').style.display = '';
      document.getElementById('tableWrap').style.display = 'none';
      renderBoard();
    } else {
      document.getElementById('boardWrap').style.display = 'none';
      document.getElementById('tableWrap').style.display = '';
      renderTable();
    }
  }

  function setView(view){
    currentView = view;
    document.getElementById('boardViewBtn').classList.toggle('active', view === 'board');
    document.getElementById('tableViewBtn').classList.toggle('active', view === 'table');
    renderActiveView();
  }

  const BOARD_COLUMNS = [
    { key: 'pending', label: 'Pending', statusValue: '' },
    { key: 'approved', label: 'Approved', statusValue: 'Approved' },
    { key: 'lost', label: 'Lost', statusValue: 'Lost' }
  ];

  function renderBoard(){
    const rows = filteredRows();
    const wrap = document.getElementById('boardWrap');

    wrap.innerHTML = '<div class="board" id="boardGrid"></div>';
    const grid = document.getElementById('boardGrid');

    BOARD_COLUMNS.forEach(col => {
      const colRows = rows.filter(r => statusKey(r.values[COL.STATUS]) === col.key);
      const total = colRows.reduce((sum, r) => {
        const v = col.key === 'lost' ? r.values[COL.LOST] : r.values[COL.FINAL] || r.values[COL.QUOTED];
        return sum + (Number(v) || 0);
      }, 0);

      const colEl = document.createElement('div');
      colEl.className = 'board-col ' + col.key;
      colEl.setAttribute('data-status', col.statusValue);
      colEl.innerHTML = `
        <div class="board-col-head"><h3>${col.label}</h3><span class="count">${colRows.length}</span></div>
        <div class="board-col-total">${fmtMoney(total)}</div>
      `;

      if (!colRows.length){
        const empty = document.createElement('div');
        empty.className = 'board-empty';
        empty.textContent = 'No estimates here.';
        colEl.appendChild(empty);
      }

      colRows.forEach(r => {
        const v = r.values;
        const card = document.createElement('div');
        card.className = 'board-card';
        card.setAttribute('draggable', 'true');
        card.setAttribute('data-row', r.row);
        card.innerHTML = `
          <div class="bc-top"><span class="bc-est">${v[COL.ESTIMATE_NUMBER] || 'Row ' + r.row}</span><span class="bc-value">${fmtMoney(v[COL.FINAL] || v[COL.QUOTED])}</span></div>
          <div class="bc-client">${v[COL.CLIENT] || '—'}</div>
          <div class="bc-rep">${v[COL.REP] || '—'}</div>
        `;
        card.addEventListener('click', () => openPanel(r.row));
        card.addEventListener('dragstart', () => {
          draggedRow = r.row;
          card.classList.add('dragging');
        });
        card.addEventListener('dragend', () => card.classList.remove('dragging'));
        colEl.appendChild(card);
      });

      colEl.addEventListener('dragover', (ev) => { ev.preventDefault(); colEl.classList.add('drag-over'); });
      colEl.addEventListener('dragleave', () => colEl.classList.remove('drag-over'));
      colEl.addEventListener('drop', (ev) => {
        ev.preventDefault();
        colEl.classList.remove('drag-over');
        if (draggedRow != null) moveCardToStatus(draggedRow, col.statusValue);
        draggedRow = null;
      });

      grid.appendChild(colEl);
    });
  }

  async function moveCardToStatus(rowNum, newStatus){
    const found = allRows.find(r => r.row === rowNum);
    if (!found) return;
    if (statusKey(found.values[COL.STATUS]) === statusKey(newStatus)) return; // no-op, dropped in same column

    try{
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'update', key: APPS_SCRIPT_KEY, row: rowNum, fields: { status: newStatus } })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Could not update status');
      found.values[COL.STATUS] = newStatus;
      renderScorecards();
      renderBoard();
    }catch(err){
      alert('Could not move this estimate: ' + (err.message || ''));
      renderBoard();
    }
  }

  function lineItemColumns(){
    return allHeaders.filter(h => h && META_COLUMNS.indexOf(h) === -1);
  }

  function renderLineItems(values){
    const cols = lineItemColumns();
    const wrap = document.getElementById('lineItemsWrap');
    if (!cols.length){
      wrap.innerHTML = '<div class="empty-state" style="padding:20px 0;">No product columns detected.</div>';
      return;
    }
    wrap.innerHTML = cols.map(colName => {
      const raw = values[colName];
      const hasValue = raw !== '' && raw !== null && raw !== undefined && Number(raw) !== 0;
      return `
        <div class="line-item ${hasValue ? 'selected' : ''}" data-col="${colName}">
          <input type="checkbox" class="li-check" ${hasValue ? 'checked' : ''}>
          <span class="li-name">${colName}</span>
          <input type="number" step="0.01" class="li-value" value="${hasValue ? raw : ''}" ${hasValue ? '' : 'disabled'}>
        </div>
      `;
    }).join('');

    wrap.querySelectorAll('.line-item').forEach(row => {
      const checkbox = row.querySelector('.li-check');
      const valueInput = row.querySelector('.li-value');
      checkbox.addEventListener('change', () => {
        row.classList.toggle('selected', checkbox.checked);
        valueInput.disabled = !checkbox.checked;
        if (!checkbox.checked) valueInput.value = '';
      });
    });
  }

  function openPanel(rowNum){
    const found = allRows.find(r => r.row === rowNum);
    if (!found) return;
    activeRow = found;
    const v = found.values;

    document.getElementById('panelTitle').textContent = v[COL.ESTIMATE_NUMBER] || ('Row ' + rowNum);
    document.getElementById('panelSub').textContent =
      (v[COL.CLIENT] || '') + ' · ' + (v[COL.REP] || '') + (v[COL.SUBDIVISION] ? ' · ' + v[COL.SUBDIVISION] : '');

    const addressLine = [v[COL.ADDRESS], v[COL.CITY], v[COL.STATE_ZIP]].filter(Boolean).join(', ') || '—';

    document.getElementById('readonlyGrid').innerHTML = `
      <div><div class="k">Date</div><div class="v">${v[COL.DATE] || '—'}</div></div>
      <div><div class="k">Date Requested</div><div class="v">${v[COL.DATE_REQUESTED] || '—'}</div></div>
      <div style="grid-column:1 / -1;"><div class="k">Address</div><div class="v">${addressLine}</div></div>
      <div><div class="k">Subdivision</div><div class="v">${v[COL.SUBDIVISION] || '—'}</div></div>
      <div><div class="k">Lot #</div><div class="v">${v[COL.LOT] || '—'}</div></div>
      <div><div class="k">Customer Type</div><div class="v">${v[COL.CUSTOMER_TYPE] || '—'}</div></div>
      <div><div class="k">Week #</div><div class="v">${v[COL.WEEK] || '—'}</div></div>
      <div><div class="k">Quoted</div><div class="v">${fmtMoney(v[COL.QUOTED])}</div></div>
      <div><div class="k">Work Order #</div><div class="v">${v[COL.WORK_ORDER] || '—'}</div></div>
      <div><div class="k">Close Date</div><div class="v">${v[COL.CLOSE_DATE] || '—'}</div></div>
    `;

    document.getElementById('fStatus').value = v[COL.STATUS] || '';
    document.getElementById('fFinalValue').value = v[COL.FINAL] || '';
    document.getElementById('fNotes').value = v[COL.NOTES] || '';
    renderLineItems(v);
    document.getElementById('saveMsg').style.display = 'none';

    document.getElementById('overlay').classList.add('open');
    document.getElementById('editPanel').classList.add('open');
  }

  function closePanel(){
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('editPanel').classList.remove('open');
    activeRow = null;
  }

  async function saveChanges(){
    if (!activeRow) return;
    const fields = {
      status: document.getElementById('fStatus').value,
      finalValue: document.getElementById('fFinalValue').value,
      notes: document.getElementById('fNotes').value
    };

    // Collect selected line items -- unchecked items are sent as blank (cleared)
    document.querySelectorAll('#lineItemsWrap .line-item').forEach(row => {
      const col = row.getAttribute('data-col');
      const checked = row.querySelector('.li-check').checked;
      const val = row.querySelector('.li-value').value;
      fields[col] = checked ? val : '';
    });

    const msg = document.getElementById('saveMsg');
    msg.className = 'save-msg'; msg.style.display = 'block'; msg.textContent = 'Saving…';

    try{
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight
        body: JSON.stringify({ action: 'update', key: APPS_SCRIPT_KEY, row: activeRow.row, fields: fields })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Save failed');

      // Update local state without a full reload
      Object.keys(fields).forEach(key => {
        const target = key === 'status' ? COL.STATUS : key === 'finalValue' ? COL.FINAL : key === 'notes' ? COL.NOTES : key;
        activeRow.values[target] = fields[key];
      });
      renderScorecards();
      renderActiveView();

      msg.className = 'save-msg ok'; msg.style.display = 'block'; msg.textContent = 'Saved ✓';
      setTimeout(closePanel, 900);
    }catch(err){
      msg.className = 'save-msg err'; msg.style.display = 'block';
      msg.textContent = 'Could not save: ' + (err.message || '');
    }
  }

  document.getElementById('overlay').addEventListener('click', closePanel);
  document.getElementById('panelCloseBtn').addEventListener('click', closePanel);
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closePanel(); });
  document.getElementById('cancelBtn').addEventListener('click', closePanel);
  document.getElementById('saveBtn').addEventListener('click', saveChanges);
  document.getElementById('refreshBtn').addEventListener('click', loadEstimates);
  document.getElementById('searchInput').addEventListener('input', renderActiveView);
  document.getElementById('statusFilter').addEventListener('change', renderActiveView);
  document.getElementById('boardViewBtn').addEventListener('click', () => setView('board'));
  document.getElementById('tableViewBtn').addEventListener('click', () => setView('table'));

  // Deep-link support -- the Hub's "Estimates pending" stat card opens this
  // page with ?status=pending so it lands pre-filtered instead of just open.
  (function applyStatusFromUrl(){
    const params = new URLSearchParams(window.location.search);
    const status = params.get('status');
    if (!status) return;
    const select = document.getElementById('statusFilter');
    if ([...select.options].some(o => o.value === status)) select.value = status;
  })();

  loadEstimates();
</script>
</body>
</html>
